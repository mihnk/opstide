# OpsTide runs as one pod with one SQLite writer on a PersistentVolume.
# It only reads from the Kubernetes API (list and watch) and sends nothing
# out of the cluster.

image:
  repository: ghcr.io/mihnk/opstide
  # Defaults to the chart's appVersion. A whole-number tag like 2 needs
  # --set-string image.tag=2, or Helm turns it into the number 2.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Adds an "Open in Clustrail" link to each CronJob. A URL template with
# {cluster}, {namespace} and {name}; http, https or clustrail:// only.
# Empty shows no link. Set it with --set-string or -f: --set splits on commas.
clustrail:
  url: ""

# Name shown in the UI. Empty shows "cluster".
clusterName: ""

# Namespaces to watch. Empty watches the whole cluster with a ClusterRole;
# a list creates a Role and RoleBinding in each namespace instead.
namespaces: []

# How long after a Deployment rollout completes OpsTide watches the release
# before it can be called healthy: 5, 10, 15 or 30 minutes. A reader can also
# ask the release page to judge it by another length.
releases:
  observationMinutes: 10

# Node conditions and scheduling changes. Nodes are cluster-scoped, so this needs
# list and watch on nodes cluster-wide (a small ClusterRole is added); it is off by default,
# also for installs limited to some namespaces. Capacity, labels, taints and images are not read.
nodes:
  observe: false

# ConfigMaps and Secrets: when one is created, deleted or written, and by which field manager.
watch:
  # list and watch on configmaps. A hash of the content and the names of keys are kept, never a value.
  configMaps: true
  # list and watch on secrets, read through the metadata-only API: OpsTide asks for metadata, so a Secret's data is
  # never sent to it. Kubernetes RBAC cannot grant metadata alone, so turning this on grants list and watch on Secrets
  # themselves (in the watched namespaces, or cluster-wide); only the request is metadata-only. Off by default.
  secretMetadata: false

retention:
  days: 30
  maxEntries: 2000000
  # A separate budget for routine-volume entries (Pod lifecycle, Event entries, autoscaler entries, reported counts,
  # Job creation), so a burst of them (a node upgrade, a crash loop) cannot push out older Job and release history.
  # 0 means half of maxEntries. When a budget, not age, removes records, System and the Explorer say so.
  maxRoutineEntries: 0

logLevel: info

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

persistence:
  enabled: true
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  storageClass: ""
  size: 5Gi
  # One writer: the volume is mounted by one pod at a time.
  accessModes: [ReadWriteOnce]
  annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

# The API and /metrics ask for one shared token (Authorization: Bearer ...);
# the web page asks for it once and keeps a session cookie. The probes stay
# open. The token is a random Secret made on install and kept on upgrade and
# uninstall. Read it:
#   kubectl -n <ns> get secret <fullname>-auth -o jsonpath='{.data.token}' | base64 -d
auth:
  enabled: true
  # Use your own Secret (key "token") instead of a generated one. Needed with
  # Argo CD and other tools that render with `helm template`: they cannot look
  # up the Secret and would make a new token on every sync. The token is read
  # at start; changing the Secret restarts the pod (a checksum annotation).
  existingSecret: ""

# Needs the Prometheus Operator's CRDs. With auth on, it scrapes with the
# token from the Secret, which must then be in serviceMonitor.namespace.
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  # Labels your Prometheus selects ServiceMonitors by (e.g. release: kube-prometheus-stack).
  labels: {}

# With auth on, the ingress shows a login page of its own. The default is no
# ingress: use kubectl port-forward.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opstide.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Traffic in: only the UI port, only from ingressFrom. Traffic out: DNS (to
# dnsNamespace), the Kubernetes API (apiServer below) and extraEgress.
#
# The API rule is only as narrow as apiServer.cidrs. The defaults limit the
# PORTS (443, 6443) but allow any address, so set cidrs to your API server's
# address (for example [10.0.0.1/32]) to also limit the destination.
#
# Cilium (and some other CNIs) do not match a self-managed control plane's
# node address with ipBlock, so this policy would block the API and OpsTide
# would never become ready. There, leave enabled=false and write a
# CiliumNetworkPolicy that allows the kube-apiserver entity instead.
networkPolicy:
  enabled: false
  # Who may open the UI and API. Empty allows pods in OpsTide's namespace
  # only: an ingress controller in another namespace must be listed.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # The namespace of the cluster's DNS.
  dnsNamespace: kube-system
  apiServer:
    cidrs: [0.0.0.0/0, "::/0"]
    ports: [443, 6443]
  # More egress rules, written as in a NetworkPolicy.
  extraEgress: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
