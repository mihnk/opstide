{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opstide.serviceAccountName" . }}
  labels:
    {{- include "opstide.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
{{- if not .Values.namespaces }}
---
# Read-only, cluster-wide: list and watch the kinds in the opstide.rules helper (batch, pods, apps, events, autoscaling,
# configmaps unless watch.configMaps is false, secrets only with watch.secretMetadata). No logs, no exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "opstide.clusterRoleName" . }}
  labels:
    {{- include "opstide.labels" . | nindent 4 }}
rules:
  {{- include "opstide.rules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opstide.clusterRoleName" . }}
  labels:
    {{- include "opstide.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opstide.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opstide.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $ns := .Values.namespaces }}
---
# Read-only in {{ $ns }}.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opstide.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "opstide.labels" $ | nindent 4 }}
rules:
  {{- include "opstide.rules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opstide.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "opstide.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opstide.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opstide.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.rbac.create .Values.nodes.observe }}
---
# Read-only, cluster-wide, and only because Node observation was asked for: list and
# watch Nodes. Nodes are cluster-scoped, so this cannot be a namespaced Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-nodes" (include "opstide.clusterRoleName" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "opstide.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-nodes" (include "opstide.clusterRoleName" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "opstide.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-nodes" (include "opstide.clusterRoleName" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opstide.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
