# Demo CronJobs that run every few minutes, so OpsTide's screens fill up
# within a quarter of an hour. Some fail, one runs long, one is suspended,
# one is not described. They only sleep and exit; nothing else happens.
apiVersion: v1
kind: Namespace
metadata: {name: payments}
---
apiVersion: v1
kind: Namespace
metadata: {name: data}
---
apiVersion: v1
kind: Namespace
metadata: {name: warehouse}
---
apiVersion: v1
kind: Namespace
metadata: {name: analytics}
---
# Every 2 minutes; fails on minutes divisible by 10 after two attempts.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: payment-reconciliation
  namespace: payments
  annotations:
    opstide.mihnk.org/name: Payment reconciliation
    opstide.mihnk.org/description: >-
      Matches the card processor's settlements against ledger entries and
      flags differences for finance. A failed run delays the settlement refresh.
    opstide.mihnk.org/owner: team-payments
    opstide.mihnk.org/criticality: high
    opstide.mihnk.org/runbook: https://wiki.example.com/runbooks/payment-reconciliation
    opstide.mihnk.org/expected-duration: 30s
spec:
  schedule: "*/2 * * * *"
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reconcile
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "sleep $((10 + RANDOM % 15)); [ $(( $(date +%M) % 10 )) -ne 0 ] || { echo 'ledger mismatch'; exit 1; }"]
---
# Every 5 minutes; no timeZone, so the controller's zone (UTC) is assumed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgres
  namespace: data
  annotations:
    opstide.mihnk.org/name: Database backup
    opstide.mihnk.org/description: pg_dump of the ledger database to object storage.
    opstide.mihnk.org/owner: team-data
    opstide.mihnk.org/criticality: critical
    opstide.mihnk.org/expected-duration: 1m
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "sleep 25"]
---
# Every 3 minutes; usually fine, sometimes longer than its expected 40 s.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: inventory-sync
  namespace: warehouse
  annotations:
    opstide.mihnk.org/name: Inventory sync
    opstide.mihnk.org/owner: team-warehouse
    opstide.mihnk.org/expected-duration: 40s
spec:
  schedule: "*/3 * * * *"
  timeZone: Europe/Istanbul
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "if [ $((RANDOM % 3)) -eq 0 ]; then sleep 75; else sleep 15; fi"]
---
# Every 4 minutes, described but with an unusable runbook link (http), so
# OpsTide lists the annotation problem.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-generation
  namespace: analytics
  annotations:
    opstide.mihnk.org/name: Report generation
    opstide.mihnk.org/owner: team-analytics
    opstide.mihnk.org/runbook: http://wiki.example.com/runbooks/reports
spec:
  schedule: "*/4 * * * *"
  timeZone: Europe/Istanbul
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "sleep 20"]
---
# Suspended: shows under Schedules → Suspended, never on Today.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: legacy-export
  namespace: analytics
spec:
  schedule: "0 * * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: export
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["true"]
---
# No annotations at all: shows under Schedules → Not described.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cache-warmup
  namespace: analytics
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: warm
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c", "sleep 5"]
---
# A Deployment for rollouts: make demo-rollout restarts it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels: {app: payments-api}
  template:
    metadata:
      labels: {app: payments-api}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do sleep 3600; done"]
